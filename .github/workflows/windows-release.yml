name: windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev,packaging]"
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/validate_release.py --tag "${{ github.ref_name }}"
      - name: Validate development version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python scripts/validate_release.py
      - name: Run tests
        run: python -m pytest
      - name: Run static checks
        run: python -m ruff check .
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm packaging/gaming-buddy.spec
      - name: Build installer and checksum
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1 -SkipApplicationBuild
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: gaming-buddy-windows-${{ github.run_id }}
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error

  installer_test:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: gaming-buddy-windows-${{ github.run_id }}
          path: release
      - name: Test installer lifecycle
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          ./scripts/test_windows_installer.ps1 `
            -InstallerPath "release/Gaming-Buddy-Setup-$version-x64.exe" `
            -Version $version
      - name: Upload installer test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gaming-buddy-installer-test-${{ github.run_id }}
          path: installer-test/
          if-no-files-found: warn

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, installer_test]
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: gaming-buddy-windows-${{ github.run_id }}
          path: release
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $installer = "release/Gaming-Buddy-Setup-$version-x64.exe"
          $checksum = "$installer.sha256"
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "$digest  $([IO.Path]::GetFileName($installer))"
          if ((Get-Content -LiteralPath $checksum -Raw).Trim() -cne $expected) {
            throw "Release installer checksum or filename does not match."
          }
          $assets = @($installer, $checksum)
          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --draft `
            --generate-notes `
            --title "Gaming Buddy $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
