name: windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev,packaging]"
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/validate_release.py --tag "${{ github.ref_name }}"
      - name: Validate development version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python scripts/validate_release.py
      - name: Run tests
        run: python -m pytest
      - name: Run static checks
        run: python -m ruff check .
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm packaging/gaming-buddy.spec
      - name: Build installer and checksum
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1 -SkipApplicationBuild
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: gaming-buddy-windows-${{ github.run_id }}
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: gaming-buddy-windows-${{ github.run_id }}
          path: release
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath release -File | Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --generate-notes `
            --title "Gaming Buddy $env:GITHUB_REF_NAME"
