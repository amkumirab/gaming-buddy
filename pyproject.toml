[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gaming-buddy"
version = "0.1.0"
description = "A lightweight in-game notebook and screenshot overlay for Windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Amir Ali Mirab Zadeh Ardekani" }]
keywords = ["gaming", "overlay", "notebook", "screenshot", "pyside6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "PySide6>=6.7,<7",
  "pynput>=1.7.7,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
gaming-buddy = "gaming_buddy.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaming_buddy = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
